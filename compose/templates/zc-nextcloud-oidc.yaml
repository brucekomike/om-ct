# Standalone dev/test stack: Nextcloud (php-fpm) for an external OIDC identity
# provider, reachable at http://$CLOUDURL:\${NC_OIDC_PORT}/
#
# Why the topology looks like this -- all three points were measured, see
# docs/source/reference/02-nextcloud.md:
#
#   1. \`network_mode: host\` is REQUIRED, not a shortcut. Nextcloud's HTTP client
#      is Guzzle/cURL, and cURL sends every \`*.localhost\` name to loopback
#      regardless of DNS (RFC 6761). A bridge-networked container therefore
#      cannot reach a Casdoor that is published on the host's 127.0.0.1:8000 --
#      it fails with "cURL error 7" even though the container's DNS resolves the
#      name to the Casdoor container. With host networking, loopback *is* the
#      host's loopback, and the published port answers. This is also why
#      za-nextcloud.yaml is built the same way.
#   2. The database stays on the default project network but is published on the
#      host's loopback, and the service name \`cloud_db\` is aliased to it via
#      extra_hosts -- the same trick za-nextcloud.yaml uses. That keeps
#      \`dbhost => cloud_db\`, which is what .env.nextcloud installs into
#      config.php, resolvable after the topology changes. Bound to 127.0.0.1
#      only, unlike za-nextcloud.yaml, whose host-networked mariadb is reachable
#      from every interface.
#   3. container_name is omitted so nothing collides with the main stack, and
#      the Compose project name is pinned.
name: nc-oidc-test

services:
  cloud:
    depends_on:
      - cloud_db
    image: nextcloud:32.0.5-fpm
    network_mode: "host"
    env_file:
      - .env.nextcloud
    environment:
      # .env.nextcloud bakes HTTP(S)_PROXY to http://$HOSTNAME:7890 -- the
      # *generating* machine's hostname, unresolvable inside a container. With
      # host networking the documented 127.0.0.1 form works again.
      HTTP_PROXY: http://127.0.0.1:7890
      HTTPS_PROXY: http://127.0.0.1:7890
      NO_PROXY: 127.0.0.1,localhost,$CLOUDURL
      # NOTE: the image only honours NEXTCLOUD_TRUSTED_DOMAINS when it performs
      # the install itself. If you install with occ instead, set trusted_domains
      # with occ too -- see the doc.
      NEXTCLOUD_TRUSTED_DOMAINS: $CLOUDURL
    extra_hosts:
      - "cloud_db:127.0.0.1"
    volumes:
      - cloud_full:/var/www/html
      - cloud_full:/var/www/nextcloud
  cloud_db:
    image: mariadb:12.1.2-noble
    env_file:
      - .env.nextcloud
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - cloud_db_data:/var/lib/mysql
  nginx:
    image: nginx:trixie
    depends_on:
      - cloud
    network_mode: "host"
    volumes:
      - ./nginx-oidc-cloud.conf:/etc/nginx/conf.d/default.conf:ro
      - cloud_full:/var/www/nextcloud:ro

volumes:
  cloud_db_data:
  cloud_full:
