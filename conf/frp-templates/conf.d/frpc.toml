# please make sure these name are:
# unique in ALL clients
# otherwise config overwritten triggered
[[proxies]]
name = \"http-$HOSTNAME\"
type = \"http\"
localIP = \"nginx\"
localPort = 80
customDomains = [$site_url_text]
transport.useEncryption = true
transport.useCompression = true
transport.proxyProtocolVersion = "v2"

[[proxies]]
name = \"https-$HOSTNAME\"
type = \"https\"
localIP = \"nginx\"
localPort = 443
customDomains = [$site_url_text]
transport.useEncryption = true
transport.useCompression = true
transport.proxyProtocolVersion = "v2"

[[proxies]]
name = \"ssh-$HOSTNAME\"
type = \"tcp\"
localIP = \"gitlab\"
localPort = 22
remotePort = 22222
transport.useEncryption = true
transport.useCompression = true
